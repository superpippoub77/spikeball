<!-- telefono: dalla schermata Home il gioco si apre a tutto schermo e in orizzontale (manifest.json) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; height: 100dvh; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  body.hd canvas { image-rendering: auto; }
  /* effetto CRT (tasto K o impostazioni): righe di scansione, bordo scuro arrotondato, colori più accesi e un leggero sfarfallio */
  /* pannello della foto del giocatore (myplayer.js) */
  #photoCap { position: fixed; inset: 0; z-index: 50; background: rgba(4,10,30,0.88); display: flex; align-items: center; justify-content: center; font-family: "Arial Black", Arial, sans-serif; }
  #photoCap .pc-box { background: #0a1e4a; border: 2px solid #3a7ae0; border-radius: 10px; padding: 14px; width: min(360px, calc(100vw - 32px)); color: #fff; text-align: center; }
  #photoCap .pc-title { color: #ffd23a; font-size: 18px; margin-bottom: 8px; }
  #photoCap .pc-stage { position: relative; width: 100%; aspect-ratio: 1; }
  #photoCap video { display: none; }
  #photoCap canvas { width: 100%; height: 100%; border-radius: 6px; touch-action: none; cursor: grab; }
  #photoCap .pc-hint { font: 12px Arial, sans-serif; color: #9ab8f0; margin: 8px 0; }
  #photoCap .pc-zoom { font-size: 12px; display: flex; gap: 8px; align-items: center; justify-content: center; }
  #photoCap .pc-zoom input { flex: 1; }
  #photoCap .pc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  #photoCap button { font: bold 13px "Arial Black", Arial, sans-serif; padding: 10px 4px; border: 0; border-radius: 6px; background: #2a8ae8; color: #fff; cursor: pointer; }
  #photoCap button[data-a=ok] { background: #2ab060; } #photoCap button[data-a=no] { background: #a03040; }
  #photoCap button:disabled { opacity: 0.4; cursor: default; }
  #crt { position: fixed; pointer-events: none; display: none; z-index: 10; border-radius: 2.5% / 3.5%;
         background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 50%, rgba(0,0,0,0.28) 50%, rgba(0,0,0,0.28) 100%);
         box-shadow: inset 0 0 6vmin rgba(0,0,0,0.75), inset 0 0 1.5vmin rgba(0,0,0,0.6); animation: crtflick 0.12s infinite; }
  #crt::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
         background: radial-gradient(ellipse at center, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%); }
  body.crt #crt { display: block; }
  body.crt canvas { filter: contrast(1.12) saturate(1.2) brightness(1.06); }
  @keyframes crtflick { 0% { opacity: 0.94; } 50% { opacity: 1; } 100% { opacity: 0.96; } }
</style>
</head>
<body>
<div id="crt"></div>
<div id="game"></div>
<script>
// errori all'avvio (un file mancante, o vecchio rimasto nella cache del browser): si vedono sullo schermo
// invece di una pagina nera. Dopo l'avvio gli errori del gioco li mostra showGameError (scenes.js).
(function () {
  const show = m => {
    let b = document.getElementById('gameErr');
    if (!b) {
      b = document.createElement('div'); b.id = 'gameErr'; b.title = 'clic per chiudere'; b.onclick = () => b.remove();
      b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:60;background:rgba(120,10,20,0.92);color:#fff;font:12px monospace;padding:6px 8px;border-radius:6px;cursor:pointer';
      (document.body || document.documentElement).appendChild(b);
    }
    b.textContent = 'ERRORE: ' + m + '  (prova a ricaricare la pagina senza cache: Ctrl+F5, o svuota la cache sul telefono)';
  };
  window.addEventListener('error', e => {
    if (e.target && e.target.tagName === 'SCRIPT') show('file non caricato: ' + e.target.src);
    else if (!window.__game) show(e.message);
  }, true);
  window.addEventListener('unhandledrejection', e => { const r = e.reason; show(String(r && (r.stack || r.message) || r).split('\n')[0]); });
  window.addEventListener('load', () => setTimeout(() => { if (!window.__game) show('il gioco non è partito'); }, 20000));
})();
</script>
